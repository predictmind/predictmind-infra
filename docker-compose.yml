# PredictMind — local development stack.
#
# Brings up all microservices, the gateway, web, ai, and the data stores,
# each as its own image + container on a shared Docker network. Services reach
# each other and the data stores by service name (e.g. host "postgres"), never
# "localhost" — inside a container "localhost" means the container itself.
#
# Service source lives in sibling repos; clone them next to this repo:
#
#   predictmind-api (gateway), predictmind-auth-service, predictmind-market-service,
#   predictmind-news-service, predictmind-strategy-service,
#   predictmind-backtest-service, predictmind-paper-service,
#   predictmind-reporting-service, predictmind-web, predictmind-ai
#
# The secrets below are LOCAL DEV ONLY placeholders — never real credentials.
#
# Usage:
#   docker compose up --build                 # everything
#   docker compose up --build postgres market # just what you need

name: predictmind

services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: predictmind
      POSTGRES_PASSWORD: predictmind
      POSTGRES_DB: predictmind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: predictmind
      MINIO_ROOT_PASSWORD: predictmind
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  gateway:
    build: ../predictmind-api
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      JWT_ACCESS_SECRET: local-dev-access-secret-not-for-production
      AUTH_SERVICE_URL: http://auth:3002
      MARKET_SERVICE_URL: http://market:3003
      NEWS_SERVICE_URL: http://news:3004
      STRATEGY_SERVICE_URL: http://strategy:3005
      BACKTEST_SERVICE_URL: http://backtest:3006
      PAPER_SERVICE_URL: http://paper:3007
      REPORTING_SERVICE_URL: http://reporting:3008
    depends_on:
      - auth
      - market
      - news
      - strategy
      - backtest
      - paper
      - reporting

  auth:
    build: ../predictmind-auth-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://predictmind:predictmind@postgres:5432/predictmind?schema=auth
      JWT_ACCESS_SECRET: local-dev-access-secret-not-for-production
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: local-dev-refresh-secret-not-for-production
      JWT_REFRESH_TTL: 30d
      RESET_TOKEN_TTL: 1h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  market:
    build: ../predictmind-market-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://predictmind:predictmind@postgres:5432/predictmind?schema=market
      BINANCE_API_URL: https://api.binance.com
      SYNC_ENABLED: "true"
      SYNC_TIMEFRAMES: 1h
    depends_on:
      postgres:
        condition: service_healthy

  news:
    build: ../predictmind-news-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://predictmind:predictmind@postgres:5432/predictmind?schema=news
      COLLECT_ENABLED: "true"
      AI_SERVICE_URL: http://ai:8000
      AI_ANALYSIS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started

  strategy:
    build: ../predictmind-strategy-service
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      DATABASE_URL: postgresql://predictmind:predictmind@postgres:5432/predictmind?schema=strategy
    depends_on:
      postgres:
        condition: service_healthy

  backtest:
    build: ../predictmind-backtest-service
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      DATABASE_URL: postgresql://predictmind:predictmind@postgres:5432/predictmind?schema=backtest
    depends_on:
      postgres:
        condition: service_healthy

  paper:
    build: ../predictmind-paper-service
    ports:
      - "3007:3007"
    environment:
      PORT: 3007
      DATABASE_URL: postgresql://predictmind:predictmind@postgres:5432/predictmind?schema=paper
    depends_on:
      postgres:
        condition: service_healthy

  reporting:
    build: ../predictmind-reporting-service
    ports:
      - "3008:3008"
    environment:
      PORT: 3008
      DATABASE_URL: postgresql://predictmind:predictmind@postgres:5432/predictmind?schema=reporting
    depends_on:
      postgres:
        condition: service_healthy

  ai:
    build: ../predictmind-ai
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://predictmind:predictmind@postgres:5432/predictmind?schema=ai
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ../predictmind-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    depends_on:
      - gateway

volumes:
  pgdata:
  miniodata:
